name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Posts written in the web admin arrive as Markdown only. Generate their pages
      # here and commit them back, so the repository always matches the live site.
      - name: Generate pages from Markdown
        run: python3 scripts/sync_site.py

      - name: Commit generated pages
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Rebuild site pages"
            if git push; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Could not push the generated pages (a newer commit exists); the next run will pick them up."
            fi
          fi

      # Pages can publish in two ways (Settings -> Pages -> Source):
      #   legacy   = "Deploy from a branch": GitHub publishes the branch by itself
      #   workflow = "GitHub Actions": this workflow uploads and deploys the site
      - name: Check how Pages is published
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type || true)"
          echo "Pages build type: ${build_type:-unknown}"
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"

      # A commit pushed by a workflow does not start a branch build on its own,
      # so ask for one. Running this workflow by hand also forces a rebuild.
      - name: Ask Pages to publish the branch again
        if: steps.pages.outputs.build_type == 'legacy' && (steps.commit.outputs.pushed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Configure Pages
        if: steps.pages.outputs.build_type != 'legacy'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.pages.outputs.build_type != 'legacy'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: needs.build.outputs.build_type != 'legacy'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
